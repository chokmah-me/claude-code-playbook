name: Create Release Archive

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Create release archive
      run: |
        mkdir -p release/playbook_${{ github.ref_name }}
        cp -r .claude release/playbook_${{ github.ref_name }}/
        cp -r skills release/playbook_${{ github.ref_name }}/
        cp -r templates release/playbook_${{ github.ref_name }}/
        cp CLAUDE.md LICENSE README.md CHANGELOG.md CITATION.cff .zenodo.json \
           .cursorrules .claudeignore 2>/dev/null || true \
           release/playbook_${{ github.ref_name }}/ 2>/dev/null || true
        # Copy root-level dotfiles that exist
        for f in .claudeignore; do
          [ -f "$f" ] && cp "$f" release/playbook_${{ github.ref_name }}/ || true
        done
        cd release
        zip -r ClaudePlaybook_${{ github.ref_name }}.zip playbook_${{ github.ref_name }}/

    - name: Read release notes
      id: release_notes
      run: |
        VERSION="${{ github.ref_name }}"
        NOTE_FILE="RELEASE_NOTES_${VERSION}.md"
        if [ -f "$NOTE_FILE" ]; then
          echo "body<<EOF" >> $GITHUB_OUTPUT
          cat "$NOTE_FILE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        else
          echo "body=See CHANGELOG.md for details." >> $GITHUB_OUTPUT
        fi

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: release/ClaudePlaybook_${{ github.ref_name }}.zip
        body: ${{ steps.release_notes.outputs.body }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
